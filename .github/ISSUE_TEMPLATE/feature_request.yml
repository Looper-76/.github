name: Feature request
description: Propose a scoped feature with evidence and acceptance criteria
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what measurable outcome is missing?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Security and data constraints
      description: Include authority, data classification, and integration limits.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What repeatable checks demonstrate completion?
    validations:
      required: true
